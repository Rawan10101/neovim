name: nvim.wasm build

on:
  pull_request:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/scripts/build_wasm.sh'
      - '.github/workflows/build_wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wasm:
    name: Build nvim.wasm (Emscripten + Zig)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache emsdk & build outputs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ./.emsdk
            build-wasm
          key: ${{ runner.os }}-wasm-emscripten-6.0.2-${{ hashFiles('build.zig', 'build.zig.zon', '.github/scripts/build_wasm.sh') }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3 python3-pip curl unzip
          python3 -m pip install --upgrade pip

      - name: Install Zig
        run: |
          set -euo pipefail
          curl -L \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          /tmp/zig-x86_64-linux-0.16.0/zig version

      - name: Install Emscripten SDK
        run: |
          set -euo pipefail
          if [ ! -d ./.emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git ./.emsdk
            cd ./.emsdk
            ./emsdk install 6.0.2
            ./emsdk activate 6.0.2
            cd -
          fi

      - name: Run build script from .github/scripts
        run: |
          chmod +x .github/scripts/build_wasm.sh
          .github/scripts/build_wasm.sh
