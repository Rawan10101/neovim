name: nvim.wasm build 

on:
  pull_request:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/scripts/build_wasm.sh'
      - '.github/workflows/build_wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wasm:
    name: Build nvim.wasm (Emscripten + Zig)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CUSTOM_BUILD_CMD: "zig build nvim_bin -Dtarget=wasm32-emscripten -Dcpu=generic+atomics+bulk_memory+mutable_globals -Demscripten-sysroot=\$EMSDK/upstream/emscripten/cache/sysroot -Doptimize=ReleaseSmall"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache emsdk & build outputs
        uses: actions/cache@v5
        with:
          path: |
            ./.emsdk
            build-wasm
          key: ${{ runner.os }}-wasm-${{ hashFiles('build.zig','build.zig.zon', '.github/scripts/build_wasm.sh') }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3 python3-pip curl unzip         
          python3 -m pip install --upgrade pip

      - name: Install Zig
        uses: ziglang/setup-zig@v1
        with:
          version: '0.16.0'

      - name: Install Emscripten SDK
        run: |
          set -euo pipefail
          if [ ! -d ./.emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git ./.emsdk
            cd ./.emsdk
            ./emsdk install 6.0.2
            ./emsdk activate 6.0.2
            cd -
          fi
          # shellcheck disable=SC1091
          source ./.emsdk/emsdk_env.sh
          emcc --version || true

      - name: Run build script from .github/scripts
        run: |
          chmod +x .github/scripts/build_wasm.sh
          .github/scripts/build_wasm.sh
